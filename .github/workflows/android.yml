name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Prepare Web Assets Directory
        run: |
          cd frontend
          mkdir -p public out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Canwe POS</title></head><body><div id="root"><h1>Canwe POS App</h1></div></body></html>' > public/index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Canwe POS</title></head><body><div id="root"><h1>Canwe POS App</h1></div></body></html>' > out/index.html

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canwe-POS-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

