version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: canwe-pos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_secure_password
      POSTGRES_DB: canwe_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
